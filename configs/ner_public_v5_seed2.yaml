model:
  checkpoint: ./models/ner/final
  max_length: 128

training:
  seed: 20260822
  learning_rate: 0.000005
  epochs: 2
  train_batch_size: 8
  eval_batch_size: 8
  gradient_accumulation_steps: 2
  weight_decay: 0.01
  warmup_ratio: 0.05
  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: overall_f1
  greater_is_better: true
  fp16: false
  bf16: false
  dataloader_num_workers: 0
  save_only_model: true

data:
  augmentation: true
  augmented_train_filename: train_public_v5.jsonl
  augmentation_statistics_filename: public_v5_statistics.json

output:
  directory: ./models/ner/public-continuation-20260807-v5-seed2
