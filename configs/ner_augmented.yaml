model:
  checkpoint: distilbert/distilbert-base-multilingual-cased
  max_length: 128

training:
  seed: 42
  learning_rate: 0.00002
  epochs: 5
  train_batch_size: 8
  eval_batch_size: 16
  gradient_accumulation_steps: 2
  weight_decay: 0.01
  warmup_ratio: 0.05
  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: overall_f1
  greater_is_better: true
  fp16: false
  bf16: false
  dataloader_num_workers: 0

data:
  augmentation: true

output:
  directory: ./models/ner/augmented
