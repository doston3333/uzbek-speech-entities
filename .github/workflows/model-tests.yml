name: Provisioned model tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Restore model assets
        uses: actions/cache@v4
        with:
          path: models
          key: model-assets-${{ runner.os }}-${{ hashFiles('configs/app.yaml') }}
          restore-keys: |
            model-assets-${{ runner.os }}-

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install locked development dependencies
        run: uv sync --locked --group dev

      - name: Provision local model assets
        run: .venv/bin/python -m uzbek_speech_entities.setup --models-only

      - name: Run slow model tests
        run: .venv/bin/python -W error -m pytest -m slow
