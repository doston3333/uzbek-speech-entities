name: Provisioned model tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Restore model assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: model-assets-${{ runner.os }}-${{ hashFiles('configs/app.yaml') }}
          restore-keys: |
            model-assets-${{ runner.os }}-

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install locked development dependencies
        run: uv sync --locked --group dev

      - name: Provision local model assets
        run: .venv/bin/python -m uzbek_speech_entities.setup --models-only

      - name: Run slow model tests
        run: .venv/bin/python -W error -m pytest -m slow
