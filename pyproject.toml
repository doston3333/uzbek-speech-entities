[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uzbek-speech-entities"
version = "0.1.0"
description = "Local Uzbek speech transcription and entity extraction"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [
  { name = "doston3333", email = "dostonbps@gmail.com" },
]
dependencies = [
  "accelerate>=1.14,<2",
  "datasets>=4.3,<6",
  "fastapi>=0.110",
  "huggingface-hub>=0.36,<1",
  "jiwer>=3.0",
  "librosa>=0.10",
  "numpy>=1.26",
  "psutil>=7.0,<8",
  "python-multipart>=0.0.9",
  "pydantic>=2.0",
  "protobuf>=3.20,<7",
  "PyYAML>=6.0",
  "seqeval==1.2.2",
  "soundfile>=0.12",
  "safetensors>=0.4,<1",
  "torch>=2.10,<2.14",
  "transformers>=4.57,<5",
  "uvicorn>=0.29",
]

[dependency-groups]
dev = [
  "build>=1,<2",
  "httpx2>=2,<3",
  "modal>=1,<2",
  "mypy>=1.10",
  "openpyxl>=3.1,<4",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.5",
  "types-PyYAML>=6",
]
tooling = [
  "uv==0.9.28",
]

[project.scripts]
uzbek-speech-setup = "uzbek_speech_entities.setup:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uzbek_speech_entities = [
  "ner/resources/*.json",
  "resources/configs/*.yaml",
  "web/*.css",
  "web/*.html",
  "web/*.js",
]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
testpaths = ["tests"]
markers = ["slow: requires audio or model resources"]

[tool.coverage.run]
branch = true
source = ["uzbek_speech_entities"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "training", "evaluation"]
exclude = ["^tests/"]
